
<!DOCTYPE html>
<html>
<head>
  <title>BlockWorld 3D</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial;
    }
    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      background: #222b;
      padding: 12px;
      border-radius: 8px;
    }
    canvas { display: block; }
  </style>
</head>
<body>
<div id="info">
  <b>BLOCKWORLD 3D</b><br>
  WASD: Move<br>
  Mouse: Look around<br>
  Space: Jump
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

const camera = new THREE.PerspectiveCamera(
  75, innerWidth / innerHeight, 0.1, 1000
);
camera.position.set(0, 3, 6);

const renderer = new THREE.WebGLRenderer();
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x668844, 2));

const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(5, 10, 5);
scene.add(light);

const grass = new THREE.MeshLambertMaterial({
  color: 0x55aa33
});

const dirt = new THREE.MeshLambertMaterial({
  color: 0x80502a
});

const cube = new THREE.BoxGeometry(1, 1, 1);

for (let x = -10; x <= 10; x++) {
  for (let z = -10; z <= 10; z++) {
    const block = new THREE.Mesh(cube, grass);
    block.position.set(x, 0, z);
    scene.add(block);
  }
}

const keys = {};
let yaw = 0;
let pitch = 0;
let verticalSpeed = 0;
let grounded = true;

document.addEventListener("keydown", e => {
  keys[e.code] = true;
});

document.addEventListener("keyup", e => {
  keys[e.code] = false;
});

renderer.domElement.addEventListener("click", () => {
  renderer.domElement.requestPointerLock();
});

document.addEventListener("mousemove", e => {
  if (document.pointerLockElement === renderer.domElement) {
    yaw -= e.movementX * 0.002;
    pitch -= e.movementY * 0.002;
    pitch = Math.max(-1.4, Math.min(1.4, pitch));
  }
});

function animate() {
  requestAnimationFrame(animate);

  const speed = 0.09;

  if (keys.KeyW) {
    camera.position.x -= Math.sin(yaw) * speed;
    camera.position.z -= Math.cos(yaw) * speed;
  }
  if (keys.KeyS) {
    camera.position.x += Math.sin(yaw) * speed;
    camera.position.z += Math.cos(yaw) * speed;
  }
  if (keys.KeyA) {
    camera.position.x -= Math.cos(yaw) * speed;
    camera.position.z += Math.sin(yaw) * speed;
  }
  if (keys.KeyD) {
    camera.position.x += Math.cos(yaw) * speed;
    camera.position.z -= Math.sin(yaw) * speed;
  }

  if (keys.Space && grounded) {
    verticalSpeed = 0.18;
    grounded = false;
  }

  verticalSpeed -= 0.009;
  camera.position.y += verticalSpeed;

  if (camera.position.y <= 3) {
    camera.position.y = 3;
    verticalSpeed = 0;
    grounded = true;
  }

  camera.rotation.order = "YXZ";
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;

  renderer.render(scene, camera);
}

animate();

window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
